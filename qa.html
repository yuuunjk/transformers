<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>QA frame</title>
<style>html,body{margin:0;padding:0;background:#0b1020}iframe{border:0;display:block;margin:0}</style>
</head><body>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get("w"), 10) || 1280, h = parseInt(q.get("h"), 10) || 800;
var f = document.createElement("iframe");
f.width = w; f.height = h; f.src = "./index.html";
document.body.appendChild(f);
window.__frame = f;
</script>
</body></html>
