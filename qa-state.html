<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>QA routine state</title></head><body>
<script>
/* QA 전용: 루틴 앱 v80과 같은 키·구조로 오늘 기록을 심고 앱으로 넘어간다. 검증 후 삭제한다.
   ?mode=school|afterschool|holiday|vacation  ?morning=0|1|2  ?after=0|1|2  ?via=tasks|claimed|rewarded  ?daymode=1 */
var q = new URLSearchParams(location.search);
var d = new Date();
var k = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
var mode = q.get("mode") || "school";
function tasks(v){
  v = String(v);
  if(v === "1") return [true, true, true];
  if(v === "2") return [true, false, true];
  return [false, false, false];
}
var via = q.get("via") || "tasks";
var m = tasks(q.get("morning")), a = tasks(q.get("after"));
var ms = { tasks:m, claimed:false }, as = { tasks:a, claimed:false };
if(via === "claimed"){
  ms.claimed = q.get("morning") === "1";
  as.claimed = q.get("after") === "1";
}
var rewarded = { morning:false, after:false };
if(via === "rewarded"){
  rewarded.morning = q.get("morning") === "1";
  rewarded.after = q.get("after") === "1";
}
var st = { xp:0, wildIndex:0, caught:{}, mode:mode, days:{} };
var day = { slots:{}, rewarded:rewarded };
if(q.get("daymode") === "1") day.mode = mode;
day.slots[mode + ":morning"] = ms;
day.slots[mode + ":after"] = as;
st.days[k] = day;
localStorage.setItem("lukaPokemonDashboard.v1", JSON.stringify(st));
location.replace("./index.html?tab=minigame");
</script>
</body></html>
