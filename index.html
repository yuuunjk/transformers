<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오토봇 도감 | AUTOBOT ARCHIVE</title>
<meta name="description" content="사이버트론에서 온 12명의 오토봇 영웅 도감. 역할, 능력치, 성격과 명장면을 한눈에!">
<meta name="theme-color" content="#071226">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오토봇 도감">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
<link rel="apple-touch-icon" href="./app-icon-180.png">
<style>
  :root{
    --bg:#050a18;
    --bg-2:#0a1734;
    --panel:rgba(13,24,49,.82);
    --panel-solid:#0d1830;
    --panel-2:rgba(20,36,70,.72);
    --line:rgba(110,166,255,.22);
    --line-strong:rgba(110,166,255,.42);
    --txt:#eaf2ff;
    --muted:#93a8ca;
    --blue:#3d9bff;
    --blue-deep:#1b5fd0;
    --cyan:#6fe3ff;
    --red:#ff4d5e;
    --gold:#ffc24a;
    --shadow:0 18px 44px rgba(0,0,0,.45);
    --radius:20px;
    --header-bg:rgba(6,12,26,.78);
    color-scheme:dark;
  }
  html[data-theme="light"]{
    --bg:#e9f1fc;
    --bg-2:#d6e6fb;
    --panel:rgba(255,255,255,.88);
    --panel-solid:#ffffff;
    --panel-2:rgba(232,242,255,.9);
    --line:rgba(23,63,130,.16);
    --line-strong:rgba(23,63,130,.3);
    --txt:#0c1a32;
    --muted:#55698c;
    --blue:#1b6fe0;
    --blue-deep:#0d4ba8;
    --cyan:#0f9fc4;
    --red:#e5364b;
    --gold:#d68a00;
    --shadow:0 16px 36px rgba(20,50,100,.16);
    --header-bg:rgba(240,246,255,.86);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 600px at 12% -10%, rgba(61,155,255,.22), transparent 60%),
      radial-gradient(760px 520px at 92% 0%, rgba(255,77,94,.16), transparent 62%),
      radial-gradient(800px 700px at 50% 120%, rgba(35,90,190,.22), transparent 65%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 58%, var(--bg) 100%);
    background-attachment:fixed;
    color:var(--txt);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.01em;
  }
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(110,166,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110,166,255,.055) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at 50% 20%, #000 20%, transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 20%, #000 20%, transparent 78%);
  }
  html[data-theme="light"] body::before{
    background-image:
      linear-gradient(rgba(23,63,130,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23,63,130,.055) 1px, transparent 1px);
  }
  button{font:inherit;color:inherit}
  img{display:block;max-width:100%}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

  /* ---------- header ---------- */
  .site-header{
    position:sticky;top:0;z-index:30;
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    background:var(--header-bg);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1180px;margin:0 auto;padding:14px 20px 12px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
  .brand-mark{
    width:48px;height:48px;border-radius:14px;overflow:hidden;flex:none;
    box-shadow:0 0 0 1px var(--line-strong), 0 8px 20px rgba(30,90,200,.35);
    background:#071226;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover}
  .brand-text{min-width:0}
  .eyebrow{
    font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--cyan);font-weight:800;margin-bottom:2px;
  }
  .brand h1{
    margin:0;font-size:clamp(20px,2.6vw,27px);font-weight:900;letter-spacing:.01em;
    background:linear-gradient(92deg,#ffffff 5%, #b9d8ff 45%, #ffb3b9 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    white-space:nowrap;
  }
  html[data-theme="light"] .brand h1{
    background:linear-gradient(92deg,#0c2a5c 5%, #1b6fe0 55%, #c92a3e 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600;letter-spacing:.02em}
  .header-tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .icon-btn{
    width:44px;height:44px;border-radius:13px;border:1px solid var(--line);
    background:var(--panel-2);cursor:pointer;font-size:19px;line-height:1;
    display:grid;place-items:center;transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .icon-btn:hover{transform:translateY(-1px);border-color:var(--line-strong)}
  .icon-btn:active{transform:scale(.96)}

  .search-row{
    max-width:1180px;margin:0 auto;padding:0 20px 16px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .search-box{
    position:relative;flex:1 1 300px;min-width:220px;
  }
  .search-box .mag{
    position:absolute;left:15px;top:50%;transform:translateY(-50%);
    color:var(--muted);pointer-events:none;display:flex;
  }
  #search{
    width:100%;height:48px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);padding:0 44px 0 42px;
    font-size:15px;font-weight:600;letter-spacing:-.01em;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #search::placeholder{color:var(--muted);font-weight:500}
  #search:focus{
    outline:none;border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(61,155,255,.2);
  }
  .fav-toggle{
    height:48px;padding:0 18px;border-radius:14px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);
    font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;
    transition:all .15s ease;white-space:nowrap;
  }
  .fav-toggle:hover{border-color:var(--line-strong)}
  .fav-toggle[aria-pressed="true"]{
    background:linear-gradient(135deg, rgba(255,194,74,.2), rgba(255,77,94,.18));
    border-color:rgba(255,194,74,.6);color:var(--gold);
  }
  .fav-toggle .count{
    background:rgba(255,194,74,.2);color:var(--gold);
    min-width:22px;height:22px;border-radius:999px;font-size:12px;
    display:inline-grid;place-items:center;padding:0 6px;font-weight:900;
  }

  /* ---------- filters ---------- */
  .filters{
    max-width:1180px;margin:0 auto;padding:0 20px 18px;
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:none;height:38px;padding:0 16px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--muted);font-weight:800;font-size:13.5px;letter-spacing:.01em;
    display:inline-flex;align-items:center;gap:7px;
    transition:all .16s ease;
  }
  html[data-theme="light"] .chip:not([aria-pressed="true"]){background:rgba(255,255,255,.6)}
  .chip:hover{color:var(--txt);border-color:var(--line-strong)}
  .chip[aria-pressed="true"]{
    color:#fff;border-color:transparent;
    background:linear-gradient(135deg,#2f8bff,#1657c8);
    box-shadow:0 6px 18px rgba(40,120,255,.35);
  }
  .chip .n{
    font-size:11px;font-weight:900;opacity:.75;
    background:rgba(0,0,0,.18);border-radius:999px;padding:2px 6px;min-width:20px;text-align:center;
  }
  .chip[aria-pressed="true"] .n{background:rgba(255,255,255,.22);opacity:1}

  /* ---------- main ---------- */
  main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:4px 20px 64px}
  .result-line{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    margin:2px 2px 16px;font-size:13px;color:var(--muted);font-weight:700;
  }
  .result-line b{color:var(--txt);font-weight:900}
  .result-line .hint{font-size:12px;font-weight:600;opacity:.8}

  .grid{
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  }
  .card{
    position:relative;border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    box-shadow:var(--shadow);
    cursor:pointer;text-align:left;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    padding:0;display:flex;flex-direction:column;
    animation:cardIn .38s ease both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card:hover{transform:translateY(-4px);border-color:var(--line-strong);
    box-shadow:0 24px 48px rgba(0,0,0,.5), 0 0 0 1px rgba(110,166,255,.18)}
  html[data-theme="light"] .card:hover{box-shadow:0 22px 40px rgba(20,50,100,.2)}
  .card-media{position:relative;aspect-ratio:1/1;overflow:hidden;background:#0a1224}
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .card:hover .card-media img{transform:scale(1.05)}
  .card-media::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,10,24,0) 52%,rgba(5,10,24,.62) 88%,var(--panel-solid) 100%);
  }
  html[data-theme="light"] .card-media{
    margin:8px 8px 0;border-radius:15px;overflow:hidden;
    box-shadow:0 6px 18px rgba(15,40,90,.16);
  }
  html[data-theme="light"] .card-media::after{
    background:linear-gradient(180deg,rgba(255,255,255,0) 68%,rgba(6,14,30,.32) 100%);
  }
  .role-badge{
    position:absolute;top:11px;left:11px;z-index:2;
    font-size:11px;font-weight:900;letter-spacing:.06em;
    padding:5px 10px;border-radius:999px;color:#fff;
    background:rgba(8,18,38,.72);border:1px solid rgba(255,255,255,.24);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .fav-btn{
    position:absolute;top:9px;right:9px;z-index:3;
    width:38px;height:38px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(255,255,255,.26);background:rgba(8,18,38,.66);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:grid;place-items:center;font-size:17px;line-height:1;
    transition:transform .14s ease, background .14s ease, border-color .14s ease;
    color:#cfdcf5;
  }
  .fav-btn:hover{transform:scale(1.08);border-color:rgba(255,194,74,.7)}
  .fav-btn[aria-pressed="true"]{
    background:linear-gradient(135deg,rgba(255,194,74,.92),rgba(255,140,60,.92));
    border-color:rgba(255,214,120,.9);color:#3a2600;
    box-shadow:0 4px 16px rgba(255,170,60,.45);
  }
  .card-body{padding:2px 15px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-name{margin:0;font-size:18.5px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
  .card-en{
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--cyan);font-weight:800;margin-top:-4px;
  }
  .card-tag{
    font-size:12.5px;color:var(--muted);line-height:1.45;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:36px;
  }
  .mini-stats{display:flex;gap:8px;margin-top:auto;padding-top:4px}
  .mini{flex:1;display:flex;flex-direction:column;gap:4px}
  .mini span{font-size:9.5px;letter-spacing:.08em;color:var(--muted);font-weight:800;text-transform:uppercase}
  .mini i{display:block;height:5px;border-radius:999px;background:rgba(140,175,230,.18);overflow:hidden}
  .mini i b{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--blue),var(--cyan));}
  .mini.fire i b{background:linear-gradient(90deg,var(--red),var(--gold))}
  .mini.str i b{background:linear-gradient(90deg,#7c5cff,var(--blue))}

  /* ---------- empty ---------- */
  .empty{
    grid-column:1/-1;text-align:center;padding:64px 20px;
    border:1px dashed var(--line-strong);border-radius:var(--radius);
    background:var(--panel);
  }
  .empty .big{font-size:40px;margin-bottom:10px}
  .empty p{margin:0;color:var(--muted);font-weight:700;font-size:14px;line-height:1.6}

  /* ---------- footer ---------- */
  footer{
    position:relative;z-index:1;max-width:1180px;margin:0 auto;
    padding:8px 20px 46px;color:var(--muted);font-size:12px;line-height:1.7;
    text-align:center;font-weight:600;
  }

  /* ---------- modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:flex-start;justify-content:center;
    padding:24px 16px 40px;overflow-y:auto;
    background:rgba(3,7,16,.72);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .modal.open{display:flex;animation:fadeIn .18s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal-card{
    width:min(1000px,100%);margin:auto;border-radius:26px;overflow:hidden;
    border:1px solid var(--line-strong);
    background:linear-gradient(165deg,var(--panel-solid),var(--panel));
    box-shadow:0 40px 100px rgba(0,0,0,.65);
    animation:pop .26s cubic-bezier(.2,.9,.25,1) both;
  }
  @media (min-width:900px){
    .modal-card{display:grid;grid-template-columns:392px minmax(0,1fr);align-items:stretch}
  }
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .modal-hero{position:relative;background:#08101f;overflow:hidden}
  .modal-hero::before{
    content:"";position:absolute;inset:-10%;
    background:var(--hero-img) center/cover no-repeat;
    filter:blur(26px) saturate(.85) brightness(.42);
    transform:scale(1.1);
  }
  html[data-theme="light"] .modal-hero::before{filter:blur(26px) saturate(.9) brightness(1.15);opacity:.55}
  .modal-hero img{position:relative;z-index:1;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:center 30%;
    -webkit-mask-image:linear-gradient(180deg,#000 78%,rgba(0,0,0,.35) 94%,transparent 100%);
    mask-image:linear-gradient(180deg,#000 78%,rgba(0,0,0,.35) 94%,transparent 100%);}
  .modal-hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:linear-gradient(180deg,rgba(4,9,20,.18) 0%,rgba(4,9,20,0) 22%,rgba(4,9,20,0) 72%,var(--panel-solid) 100%);
  }
  .title-block{padding:0 0 18px}
  .title-block .role-line{
    font-size:11.5px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);
    margin-bottom:5px;
  }
  .title-block h2{
    margin:0;font-size:clamp(26px,3.8vw,34px);font-weight:900;line-height:1.1;color:var(--txt);
  }
  .title-block .en{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;
    color:var(--muted);margin-top:6px;
  }
  .modal-close{
    position:absolute;top:14px;right:14px;z-index:4;
    width:42px;height:42px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(255,255,255,.3);background:rgba(8,18,38,.66);
    color:#fff;font-size:20px;display:grid;place-items:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:transform .14s ease,background .14s ease;
  }
  .modal-close:hover{transform:rotate(90deg);background:rgba(255,77,94,.85)}
  .hero-fav{
    position:absolute;top:14px;left:14px;z-index:4;
    height:42px;padding:0 16px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,255,255,.3);background:rgba(8,18,38,.66);
    color:#fff;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:7px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:all .14s ease;
  }
  .hero-fav[aria-pressed="true"]{
    background:linear-gradient(135deg,rgba(255,194,74,.95),rgba(255,140,60,.95));
    color:#3a2600;border-color:rgba(255,220,140,.9);
  }
  .modal-body{padding:22px 26px 30px}
  .quote{
    margin:0 0 20px;padding:14px 18px;border-radius:14px;
    border-left:3px solid var(--blue);
    background:linear-gradient(90deg,rgba(61,155,255,.14),rgba(61,155,255,0));
    font-size:15px;font-weight:800;line-height:1.5;
  }
  .facts{
    display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    margin-bottom:20px;
  }
  .fact{
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    background:var(--panel-2);
  }
  .fact dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900;margin-bottom:5px}
  .fact dd{margin:0;font-size:14px;font-weight:700;line-height:1.45}
  .sec-title{
    display:flex;align-items:center;gap:9px;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:900;margin:0 0 12px;
  }
  .sec-title::before{
    content:"";width:4px;height:16px;border-radius:2px;
    background:linear-gradient(180deg,var(--blue),var(--red));
  }
  .stat-block{margin-bottom:24px}
  .stat-row{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:12px;margin-bottom:9px}
  .stat-row .lbl{font-size:12.5px;font-weight:800;color:var(--muted)}
  .stat-track{height:10px;border-radius:999px;background:rgba(140,175,230,.16);overflow:hidden}
  .stat-fill{display:block;height:100%;border-radius:999px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .stat-row .val{font-size:12.5px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
  .sw-block{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:24px}
  .sw{border-radius:16px;padding:15px 16px;border:1px solid var(--line);background:var(--panel-2)}
  .sw.good{border-color:rgba(61,155,255,.42);background:linear-gradient(160deg,rgba(61,155,255,.14),var(--panel-2))}
  .sw.bad{border-color:rgba(255,77,94,.36);background:linear-gradient(160deg,rgba(255,77,94,.12),var(--panel-2))}
  .sw h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;font-weight:900;color:var(--muted);text-transform:uppercase}
  .sw p{margin:0;font-size:13.5px;line-height:1.55;font-weight:650}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
  .tag{
    font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;
    color:var(--cyan);border:1px solid rgba(111,227,255,.3);
    background:rgba(61,155,255,.1);
  }
  .personality{
    font-size:14.5px;line-height:1.72;font-weight:600;color:var(--txt);margin:0 0 24px;
    padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);
  }
  .eps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .ep{
    display:flex;gap:14px;padding:15px 16px;border-radius:16px;
    border:1px solid var(--line);background:var(--panel-2);
  }
  .ep .no{
    flex:none;width:30px;height:30px;border-radius:10px;
    display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--blue-deep));
    box-shadow:0 4px 12px rgba(40,110,230,.4);
  }
  .ep h5{margin:0 0 4px;font-size:14.5px;font-weight:900;line-height:1.3}
  .ep p{margin:0;font-size:13px;line-height:1.6;color:var(--muted);font-weight:600}
  .funfact{
    margin-top:22px;padding:14px 16px;border-radius:16px;
    border:1px dashed rgba(255,194,74,.5);
    background:linear-gradient(135deg,rgba(255,194,74,.12),rgba(255,194,74,.03));
    font-size:13.5px;font-weight:700;line-height:1.6;
  }

  /* ---------- state ---------- */
  var FAV_KEY = "autobotDex.favorites.v1";
  var THEME_KEY = "autobotDex.theme.v1";
  var favorites = loadFavorites();
  var state = { role:"all", q:"", favOnly:false };

  function loadFavorites(){
    try{
      var raw = localStorage.getItem(FAV_KEY);
      if(!raw) return [];
      var arr = JSON.parse(raw);
      if(!Array.isArray(arr)) return [];
      return arr.filter(function(v){ return typeof v === "string" && BOTS.some(function(b){return b.id===v;}); });
    }catch(e){ return []; }
  }
  function saveFavorites(){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); }catch(e){}
  }
  function isFav(id){ return favorites.indexOf(id) !== -1; }
  function toggleFav(id){
    var i = favorites.indexOf(id);
    if(i === -1) favorites.push(id); else favorites.splice(i,1);
    saveFavorites(); render(); syncModalFav();
  }

  /* ---------- theme ---------- */
  function applyTheme(t){
    if(t === "light") document.documentElement.setAttribute("data-theme","light");
    else document.documentElement.removeAttribute("data-theme");
    var btn = document.getElementById("themeBtn");
    if(btn) btn.textContent = (t === "light") ? "☀️" : "🌙";
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", t === "light" ? "#e9f1fc" : "#071226");
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  }
  (function initTheme(){
    var t = null;
    try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
    if(!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
    applyTheme(t === "light" ? "light" : "dark");
  })();

  /* ---------- filters ---------- */
  function buildFilters(){
    var wrap = document.getElementById("filters");
    wrap.innerHTML = "";
    ROLES.forEach(function(r){
      var n = (r.key === "all") ? BOTS.length : BOTS.filter(function(b){return b.role===r.key;}).length;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.dataset.role = r.key;
      btn.setAttribute("aria-pressed", String(state.role === r.key));
      btn.innerHTML = '<span aria-hidden="true">'+r.icon+'</span>'+r.label+'<span class="n">'+n+'</span>';
      btn.addEventListener("click", function(){ state.role = r.key; render(); });
      wrap.appendChild(btn);
    });
  }

  /* ---------- render ---------- */
  function filtered(){
    var q = state.q.trim().toLowerCase();
    return BOTS.filter(function(b){
      if(state.role !== "all" && b.role !== state.role) return false;
      if(state.favOnly && !isFav(b.id)) return false;
      if(q && b._search.indexOf(q) === -1) return false;
      return true;
    });
  }

  function statBar(key,val,fmt){
    var d = STAT_DEFS.filter(function(s){return s.key===key;})[0];
    return '<div class="mini '+(key==="fire"?"fire":key==="str"?"str":"")+'">'+
             '<span>'+(fmt||d.label)+'</span>'+
             '<i><b style="width:'+(val*10)+'%"></b></i>'+
           '</div>';
  }

  function cardHTML(b){
    var fav = isFav(b.id);
    return '<button class="card" type="button" data-id="'+b.id+'" aria-label="'+b.ko+' 상세 보기">'+
      '<div class="card-media">'+
        '<img src="./assets/bots/'+b.id+'.webp" alt="'+b.ko+' 실사 영화 모습" width="640" height="640" loading="lazy" decoding="async">'+
        '<span class="role-badge">'+ROLE_LABEL[b.role]+'</span>'+
        '<span class="fav-btn" role="button" tabindex="0" data-fav="'+b.id+'" aria-pressed="'+fav+'" aria-label="'+b.ko+' 즐겨찾기">'+(fav?"⭐":"☆")+'</span>'+
      '</div>'+
      '<div class="card-body">'+
        '<h3 class="card-name">'+b.ko+'</h3>'+
        '<div class="card-en">'+b.en+'</div>'+
        '<p class="card-tag">'+b.tagline+'</p>'+
        '<div class="mini-stats">'+statBar("str",b.stats.str,"힘")+statBar("spd",b.stats.spd,"스피드")+statBar("fire",b.stats.fire,"화력")+'</div>'+
      '</div>'+
    '</button>';
  }

  function render(){
    var list = filtered();
    var grid = document.getElementById("grid");

    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){
      c.setAttribute("aria-pressed", String(c.dataset.role === state.role));
    });
    var favT = document.getElementById("favToggle");
    favT.setAttribute("aria-pressed", String(state.favOnly));
    document.getElementById("favCount").textContent = String(favorites.length);

    if(!list.length){
      grid.innerHTML = '<div class="empty"><div class="big">🕳️</div><p>'+
        (state.favOnly ? "아직 최애 오토봇이 없어요.<br>카드의 ☆를 눌러 마음에 드는 오토봇을 골라 보세요!"
                       : "조건에 맞는 오토봇이 없어요.<br>다른 이름이나 특징으로 찾아보세요!")+'</p></div>';
    }else{
      grid.innerHTML = list.map(cardHTML).join("");
    }

    var rt = document.getElementById("resultText");
    if(state.q || state.favOnly || state.role !== "all"){
      rt.innerHTML = '찾은 오토봇 <b>'+list.length+'</b>명 <span style="opacity:.6">/ 전체 '+BOTS.length+'명</span>';
    }else{
      rt.innerHTML = '<b>'+BOTS.length+'</b>명의 오토봇';
    }
  }

  /* ---------- modal ---------- */
  var currentId = null;
  var lastFocus = null;

  function openModal(id){
    var b = BOTS.filter(function(x){return x.id===id;})[0];
    if(!b) return;
    currentId = id;
    lastFocus = document.activeElement;

    var img = document.getElementById("mImg");
    img.src = "./assets/bots/"+b.id+".webp";
    img.alt = b.ko + " 실사 영화 모습";
    document.getElementById("mHero").style.setProperty("--hero-img", 'url("./assets/bots/'+b.id+'.webp")');

    document.getElementById("mRole").textContent = ROLE_LABEL[b.role] + " · " + b.en;
    document.getElementById("modalTitle").textContent = b.ko;
    document.getElementById("mEn").textContent = b.en;
    document.getElementById("mQuote").textContent = b.quote;
    document.getElementById("mRoleText").textContent = b.roleText;
    document.getElementById("mVehicle").textContent = b.vehicle;
    document.getElementById("mWeapon").textContent = b.weapon;
    document.getElementById("mColor").textContent = b.color;
    document.getElementById("mPersonality").textContent = b.personality;
    document.getElementById("mStrong").textContent = b.strong;
    document.getElementById("mWeak").textContent = b.weak;
    document.getElementById("mFun").textContent = b.funFact;

    document.getElementById("mStats").innerHTML = STAT_DEFS.map(function(s){
      var v = b.stats[s.key] || 0;
      return '<div class="stat-row">'+
        '<span class="lbl">'+s.label+'</span>'+
        '<span class="stat-track"><span class="stat-fill" data-w="'+(v*10)+'" style="background:'+s.color+'"></span></span>'+
        '<span class="val">'+v+'/10</span>'+
      '</div>';
    }).join("");

    document.getElementById("mTags").innerHTML = (b.tags||[]).map(function(t){
      return '<span class="tag">'+t+'</span>';
    }).join("");

    document.getElementById("mEps").innerHTML = (b.episodes||[]).map(function(e,i){
      return '<li class="ep"><span class="no">'+(i+1)+'</span><div><h5>'+e.t+'</h5><p>'+e.d+'</p></div></li>';
    }).join("");

    syncModalFav();

    var modal = document.getElementById("modal");
    modal.hidden = false;
    modal.classList.add("open");
    modal.scrollTop = 0;
    document.body.style.overflow = "hidden";

    requestAnimationFrame(function(){
      Array.prototype.forEach.call(document.querySelectorAll(".stat-fill"), function(el){
        el.style.width = el.dataset.w + "%";
      });
    });
    document.getElementById("mClose").focus({preventScroll:true});
  }

  function syncModalFav(){
    var btn = document.getElementById("mFav");
    if(!currentId){ btn.setAttribute("aria-pressed","false"); btn.textContent="⭐ 최애"; return; }
    var f = isFav(currentId);
    btn.setAttribute("aria-pressed", String(f));
    btn.textContent = f ? "⭐ 내 최애" : "☆ 최애";
  }

  function closeModal(){
    var modal = document.getElementById("modal");
    modal.classList.remove("open");
    modal.hidden = true;
    document.body.style.overflow = "";
    currentId = null;
    if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
  }

  /* ---------- events ---------- */
  document.getElementById("grid").addEventListener("click", function(ev){
    var favEl = ev.target.closest("[data-fav]");
    if(favEl){
      ev.stopPropagation();
      toggleFav(favEl.dataset.fav);
      return;
    }
    var card = ev.target.closest(".card");
    if(card) openModal(card.dataset.id);
  });
  document.getElementById("grid").addEventListener("keydown", function(ev){
    var favEl = ev.target.closest("[data-fav]");
    if(favEl && (ev.key === "Enter" || ev.key === " ")){
      ev.preventDefault(); ev.stopPropagation(); toggleFav(favEl.dataset.fav);
    }
  });

  var searchEl = document.getElementById("search");
  var searchTimer = null;
  searchEl.addEventListener("input", function(){
    clearTimeout(searchTimer);
    var v = searchEl.value;
    searchTimer = setTimeout(function(){ state.q = v; render(); }, 90);
  });

  document.getElementById("favToggle").addEventListener("click", function(){
    state.favOnly = !state.favOnly;
    render();
  });

  document.getElementById("themeBtn").addEventListener("click", function(){
    var light = document.documentElement.getAttribute("data-theme") === "light";
    applyTheme(light ? "dark" : "light");
  });

  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("modal").addEventListener("click", function(ev){
    if(ev.target === this) closeModal();
  });
  document.getElementById("mFav").addEventListener("click", function(){
    if(currentId) toggleFav(currentId);
  });
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && currentId) closeModal();
  });

  /* ---------- start ---------- */
  buildFilters();
  render();

  /* ---------- service worker ---------- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
